<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>showmethesun.com</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--fg:#15171a;--mut:#5b6470;--line:#c9d0d8;--acc:#e8743b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e11;--fg:#f1eee8;--mut:#9aa1ad;--line:#2a2e36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e11;--fg:#f1eee8;--mut:#9aa1ad;--line:#2a2e36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:920px;margin:0 auto;padding:20px 16px 32px}
.brand{font-weight:700;font-size:1rem;color:var(--mut);margin:0 0 14px;letter-spacing:.01em}
.read{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin-bottom:14px}
.time{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:700;line-height:1;letter-spacing:-.03em}
.phase{font-size:clamp(1.2rem,3.6vw,1.7rem);font-weight:700;color:var(--acc)}
.sub{color:var(--mut);margin:4px 0 0;font-size:1rem}
svg{display:block;width:100%;height:auto;border-radius:10px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--mut)}
select,input,button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
input[type=range]{padding:0;accent-color:var(--acc)}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.live{border-color:var(--acc);color:var(--acc)}
#msg{color:var(--mut);font-size:.88rem;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>
<main>
<p class="brand">showmethesun.com</p>
<div class="read">
  <div class="time" id="time">--:--</div>
  <div class="phase" id="phase"></div>
</div>
<p class="sub" id="date"></p>
<p class="sub" id="where" style="margin-bottom:14px"></p>

<svg id="scene" viewBox="0 0 800 480" role="img" aria-label="A figure standing under the sky, with the sun where it is right now">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop id="sT" offset="0"/><stop id="sB" offset="1"/></linearGradient>
    <g id="fig" fill="currentColor" stroke="currentColor"></g>
  </defs>
  <rect width="800" height="400" fill="url(#sk)"/>
  <g id="sun">
    <circle id="s3" r="95" opacity=".12"/>
    <circle id="s2" r="58" opacity=".25"/>
    <circle id="s1" r="26"/>
  </g>
  <path id="lm" transform="translate(590 380)" fill="none" stroke-width="4" stroke-opacity=".7" stroke-linejoin="round" stroke-linecap="round"/>
  <rect id="ground" y="380" width="800" height="100"/>
  <text id="ln" x="590" y="414" fill="#fff" fill-opacity=".8" font-size="13" font-family="inherit" text-anchor="middle"></text>
  <line x1="0" x2="800" y1="380" y2="380" stroke="#fff" stroke-opacity=".18"/>
  <text id="lL" x="14" y="402" fill="#fff" fill-opacity=".8" font-size="15" font-family="inherit">East</text>
  <text id="lR" x="786" y="402" fill="#fff" fill-opacity=".8" font-size="15" font-family="inherit" text-anchor="end">West</text>
  <use id="shadow" href="#fig" x="0" y="0" color="#000"/>
  <use id="body" href="#fig" x="400" y="440"/>
  <g id="cmp" transform="translate(72 72)" font-family="inherit" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <circle r="60" fill="#000" fill-opacity=".4"/>
    <circle r="30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-dasharray="3 3"/>
    <line id="cl" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-opacity=".5"/>
    <circle r="3" fill="#fff"/>
    <circle id="cd" r="7"/>
    <text id="cU" y="-45" fill="#fff"></text><text id="cD" y="45" fill="#fff"></text>
    <text id="cL" x="-45" fill="#fff"></text><text id="cR" x="45" fill="#fff"></text>
    <text id="cf" y="78" font-size="12" font-weight="400" fill="#fff" fill-opacity=".85"></text>
  </g>
</svg>

<div class="ctl">
  <label>City<select id="city"></select></label>
  <label>Date<input type="date" id="dt"></label>
  <label>Time of day<input type="range" id="tm" min="0" max="1439" step="5"></label>

<div class="row">

<div id="msg"></div>

function parts(ms,tz){

function offMin(ms,tz){const p=parts(ms,tz);return(Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-Math.floor(ms/6e4)*6e4)/6e4}

function sunPos(ms,lat,lng){
 const d=ms/864e5-0.5+2440588-2451545,M=R*(357.5291+0.98560028*d),

 dec=Math.asin(Math.sin(L)*Math.sin(e)),ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L)),
 H0=R*(280.16+360.9856235*d)-(-lng*R)-ra,phi=lat*R,
 alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H0)),
 az=Math.atan2(Math.sin(H0),Math.cos(H0)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi)),
 H=Math.atan2(Math.sin(H0),Math.cos(H0));
 return{alt:alt/R,az,morn:H<0};
}

const K=[[-8,"#000000","#000000"],[-3,"#06091a","#190f22"],[0,"#1b2a5a","#e8743b"],[6,"#3b6fb5","#f4a35a"],[20,"#4a8fd8","#a5cdee"],[60,"#2f7fd6","#8ec5f2"]];
function sky(alt){
 const a=cl(alt,-8,60);let i=0;while(i<K.length-2&&a>K[i+1][0])i++;
 const t=(a-K[i][0])/(K[i+1][0]-K[i][0]);
 return[mix(K[i][1],K[i+1][1],t),mix(K[i][2],K[i+1][2],t)];
}
function phase(alt,m){
 if(alt<-6)return["Night","The sun is below the horizon."];
 if(alt<0)return m?["Dawn","The sun is about to rise."]:["Dusk","The sun has just set."];
 if(alt<8)return m?["Sunrise","The sun is rising, low on the horizon."]:["Sunset","The sun is setting, low on the horizon."];
 if(alt<30)return m?["Morning","The sun is climbing."]:["Late afternoon","The sun is sinking."];
 if(alt<65)return m?["Mid-morning","The sun is high and still climbing."]:["Afternoon","The sun is high and slowly descending."];
 return["Around noon","The sun is almost directly overhead."];
}

function update(){
 const c=CITIES[state.ci];let ms;
 if(state.live){ms=Date.now();const p=parts(ms,c.tz);state.date=p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0");state.min=p.h*60+p.mi}
 const [y,m,d]=state.date.split("-").map(Number);
 if(!state.live)ms=toUtc(y,m,d,state.min,c.tz);
 $("dt").value=state.date;$("tm").value=state.min;
 $("now").style.opacity=state.live?1:.6;

 const hh=Math.floor(state.min/60),mm=state.min%60;
 $("time").textContent=(hh%12||12)+":"+String(mm).padStart(2,"0")+" "+(hh<12?"am":"pm");
 $("date").textContent=new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
 $("where").textContent=c.n+(state.live?" · live":"");

 $("phase").textContent=ph[0];
 let bearing=((s.az/R+180)%360+360)%360;
 $("where").textContent+=" · "+(alt>0?Math.round(alt)+"° above the horizon, toward the "+DIR[Math.round(bearing/45)%8]:Math.round(-alt)+"° below the horizon");
 $("msg").textContent=ph[1];

 const [top,bot]=sky(alt);$("sT").setAttribute("stop-color",top);$("sB").setAttribute("stop-color",bot);
 const day=cl((alt+4)/10,0,1);
 $("ground").setAttribute("fill",mix("#050505","#4b6a3f",day));
 $("body").style.color=mix("#9aa0ad","#1d1a17",cl((alt+6)/6,0,1));
 const lp=(LM[state.ci]||"|").split("|");
 $("lm").setAttribute("d",lp[1]);$("ln").textContent=lp[0];
 $("lm").setAttribute("stroke",mix("#9aa0ad","#2b2d31",cl((alt+6)/6,0,1)));

 const fc=c.lat>=0?1:-1,sx=400+fc*Math.sin(s.az)*Math.cos(alt*R)*340,sy=380-Math.sin(alt*R)*300;
 const sc=mix("#ff6a1f","#fff4b8",cl((alt-2)/40,0,1));
 $("sun").setAttribute("transform","translate("+sx+" "+sy+")");
 $("sun").style.display=alt>-1?"":"none";
 ["s1","s2","s3"].forEach(i=>$(i).setAttribute("fill",sc));

 // compass: top is the way you face, so left/right match the scene
 const rt=fc*Math.sin(s.az),fw=fc*Math.cos(s.az);
 $("cd").setAttribute("cx",30*rt);$("cd").setAttribute("cy",-30*fw);
 $("cl").setAttribute("x2",30*rt);$("cl").setAttribute("y2",-30*fw);
 $("cd").setAttribute("fill",alt>0?sc:"none");$("cd").setAttribute("stroke",alt>0?"none":"#aaa");
 const f=fc>0?["S","N","E","W"]:["N","S","W","E"];
 ["cU","cD","cL","cR"].forEach((id,i)=>{$(id).textContent=f[i];$(id).setAttribute("fill",f[i]==="N"?"#ff8a5c":"#fff")});
 $("lL").textContent=fc>0?"East":"West";$("lR").textContent=fc>0?"West":"East";
 $("cf").textContent="You’re facing "+(fc>0?"south":"north");

 // shadow: flattened, mirrored copy of the figure, leaning away from the sun
 let sh="";
 if(alt>0.3){
  const L=Math.min(1/Math.tan(alt*R),4),k=fc*Math.sin(s.az)*L,op=Math.min(1,alt/8)*.42;
  sh="translate(400 440) matrix(1 0 "+k.toFixed(3)+" -0.17 0 0)";
  $("shadow").setAttribute("opacity",op);
 }else $("shadow").setAttribute("opacity",0);
 $("shadow").setAttribute("transform",sh||"translate(400 440)");
 $("shadow").setAttribute("x",0);$("shadow").setAttribute("y",0);
}

function figure(){$("fig").innerHTML=FIG[gender]}
$("city").innerHTML=CITIES.map((c,i)=>'<option value="'+i+'">'+c.n+"</option>").join("");
$("city").value=state.ci;
$("city").onchange=e=>{state.ci=+e.target.value;update()};
$("dt").onchange=e=>{if(e.target.value){state.date=e.target.value;state.live=false;update()}};
$("tm").oninput=e=>{state.min=+e.target.value;state.live=false;update()};
$("now").onclick=()=>{state.live=true;update()};
$("gen").onclick=()=>{gender=gender==="m"?"f":"m";figure()};
$("loc").onclick=()=>{
 if(!navigator.geolocation){$("msg").textContent="Location isn’t available in this browser. Pick a city instead.";return}
 navigator.geolocation.getCurrentPosition(p=>{
  CITIES.push({n:"Your location",lat:p.coords.latitude,lng:p.coords.longitude,tz:tzNow});
  const o=document.createElement("option");o.value=CITIES.length-1;o.textContent="Your location";$("city").appendChild(o);
  state.ci=CITIES.length-1;$("city").value=state.ci;update();
 },()=>{$("msg").textContent="Couldn’t get your location. Pick a city from the list instead."});
};
figure();update();
setInterval(()=>{if(state.live)update()},15000);
</script>
</body>
</html>
